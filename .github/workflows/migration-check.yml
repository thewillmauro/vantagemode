name: Migration check

# Fails a PR when a supabase/migrations file's version or name is not in production's
# migration history. CI checks versions and names only; the full content check runs locally
# (see the header of scripts/check_migrations.mjs).
#
# Reads history as the ci_migrations_reader role, which can only SELECT version and name from
# supabase_migrations.schema_migrations (supabase/migrations/20261017120000_ci_migrations_reader.sql).
# Secret CI_MIGRATIONS_DB_URL is that role's Supavisor session-pooler connection string.
# Fork PRs never receive secrets, so they skip with a notice.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check migrations against production history
        env:
          DB_URL: ${{ secrets.CI_MIGRATIONS_DB_URL }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$DB_URL" ]; then
            if [ "$IS_FORK" = "true" ]; then
              echo "::notice title=Migration check skipped::Fork PRs do not receive repository secrets, so production's history cannot be read. A maintainer runs this check on a branch in this repo."
              exit 0
            fi
            echo "::error title=Migration check not configured::Secret CI_MIGRATIONS_DB_URL is not set. See CLAUDE.md > Migrations for the setup steps."
            exit 1
          fi
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql "$DB_URL" -X -A -t -q -v ON_ERROR_STOP=1 \
            -c "select coalesce(json_agg(json_build_object('version', version, 'name', name) order by version), '[]') from supabase_migrations.schema_migrations" \
            > "$RUNNER_TEMP/history.json"
          node scripts/check_migrations.mjs --history "$RUNNER_TEMP/history.json"
